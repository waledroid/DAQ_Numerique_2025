<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>izifill — Candidatures</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        max-width: 920px;
        margin: 2rem auto;
        padding: 0 1.25rem 4rem;
        background: #080c13;
        background-image: radial-gradient(ellipse at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 65%);
        background-attachment: fixed;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0 0 1.2rem;
        color: #f8fafc;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        background: rgba(14, 20, 30, 0.65);
        backdrop-filter: blur(24px) saturate(200%);
        -webkit-backdrop-filter: blur(24px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      th {
        background: rgba(18, 26, 38, 0.6);
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        color: #f1f5f9;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
      select {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        background: rgba(10, 15, 24, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #f8fafc;
        outline: none;
        cursor: pointer;
      }
      select:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
      }
      a {
        color: #34d399;
        text-decoration: none;
        font-weight: 500;
      }
      a:hover {
        text-decoration: underline;
        color: #6ee7b7;
      }
      button {
        border: 1px solid rgba(239, 68, 68, 0.3);
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border-radius: 8px;
        padding: 5px 12px;
        font: 500 12px inherit;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      button:hover {
        background: rgba(239, 68, 68, 0.25);
        color: #fecaca;
        border-color: rgba(239, 68, 68, 0.45);
      }
      #empty {
        color: #94a3b8;
        padding: 2rem;
        text-align: center;
        background: rgba(14, 20, 30, 0.5);
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p id="empty" hidden></p>
    <table id="table" hidden>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
