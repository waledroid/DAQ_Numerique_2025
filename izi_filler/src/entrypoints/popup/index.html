<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>izifill</title>
    <style>
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        width: 250px;
        margin: 0;
        padding: 16px;
        background: rgba(8, 12, 19, 0.96);
        color: #f8fafc;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .brand-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding: 8px 10px;
        background: rgba(18, 26, 38, 0.55);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .brand-icon {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.95) 0%, rgba(5, 150, 105, 0.95) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      h1 {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin: 0;
        color: #f8fafc;
      }
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin: 8px 0;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 11px;
        background: rgba(16, 24, 36, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: #cbd5e1;
        font: 500 13px inherit;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      }
      button:hover {
        background: rgba(24, 34, 50, 0.8);
        color: #f8fafc;
        border-color: rgba(52, 211, 153, 0.35);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(1px) scale(0.98);
      }
      button#fill {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.95) 0%, rgba(4, 120, 87, 0.95) 100%);
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: #ffffff;
        font-weight: 700;
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      button#fill:hover {
        background: linear-gradient(135deg, rgba(52, 211, 153, 0.98) 0%, rgba(16, 185, 129, 0.98) 100%);
        box-shadow: 0 8px 26px rgba(16, 185, 129, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      #count {
        color: #94a3b8;
        font-size: 11.5px;
        text-align: center;
        margin: 10px 0 2px;
      }
    </style>
  </head>
  <body>
    <div class="brand-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" style="display:block">
          <path d="M13.5 2.5L7 12.5H12L9.5 21.5L18 10.5H13L16 2.5H13.5Z" fill="#ffffff"/>
          <circle cx="18" cy="4.5" r="1.8" fill="#6ee7b7"/>
        </svg>
      </div>
      <h1>izifill</h1>
    </div>
    <button id="fill"></button>
    <button id="profile"></button>
    <button id="tracker"></button>
    <p id="count"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
