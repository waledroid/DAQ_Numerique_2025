<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>izifill — Profil</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1.25rem 4rem;
        background: #0b101b;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 0.4rem;
      }
      .page-header .brand-icon {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.95) 0%, rgba(5, 150, 105, 0.95) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.22);
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0;
        color: #f8fafc;
      }
      #intro {
        color: #94a3b8;
        font-size: 0.95rem;
        margin-top: 0.2rem;
        margin-bottom: 1.2rem;
      }
      #profilesBar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 1rem 0 0.5rem;
      }
      .pill {
        padding: 6px 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
        background: transparent;
        color: #cbd5e1;
        font: 500 13px inherit;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      .pill:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #f8fafc;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .pill.active {
        background: #10b981;
        border-color: #10b981;
        color: #ffffff;
        font-weight: 600;
      }
      .pill.add {
        font-weight: 700;
        border-color: rgba(52, 211, 153, 0.4);
        color: #34d399;
      }
      .pill.add:hover {
        background: rgba(16, 185, 129, 0.15);
        color: #6ee7b7;
      }
      .pill.tool {
        padding: 6px 12px;
      }
      #ioBar {
        display: flex;
        gap: 8px;
        margin: 0.5rem 0 1rem;
      }
      #ioBar button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        color: #94a3b8;
        font-size: 12px;
        padding: 6px 12px;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      #ioBar button:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #f8fafc;
        border-color: rgba(255, 255, 255, 0.25);
      }
      .progress-card {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9999px;
        margin: 0.2rem 0 1rem;
      }
      #progressLabel {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 500;
      }
      #progress {
        font-weight: 700;
        font-size: 13.5px;
        color: #10b981;
      }
      #tabs {
        display: flex;
        gap: 8px;
        border-bottom: none;
        margin: 1.2rem 0 0.8rem;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      #tabs button {
        background: transparent;
        color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 9999px;
        padding: 7px 16px;
        font: 500 13px inherit;
        cursor: pointer;
        transition: all 0.18s ease;
        white-space: nowrap;
      }
      #tabs button:hover {
        color: #f8fafc;
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.04);
      }
      #tabs button.active {
        color: #10b981;
        border: 1.5px solid #10b981;
        background: transparent;
        font-weight: 600;
        text-shadow: none;
        box-shadow: none;
      }
      .iz-group {
        background: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        padding: 1.3rem 1.5rem;
        margin: 1.2rem 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .iz-group h2 {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.2px;
        color: #0f172a;
        margin: 0 0 1rem;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .iz-field {
        display: block;
        margin: 0.85rem 0;
      }
      .iz-field span {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 5px;
      }
      .iz-field input, .iz-field textarea {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #ffffff;
        color: #0f172a;
        font: inherit;
        box-sizing: border-box;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
      }
      .iz-field input:focus, .iz-field textarea:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      }
      .iz-field input[type="file"] {
        padding: 8px 10px;
        cursor: pointer;
        background: #f8fafc;
      }
      .iz-field input[type="file"]::file-selector-button {
        padding: 5px 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #e2e8f0;
        color: #1e293b;
        font: 500 12px inherit;
        cursor: pointer;
        margin-right: 10px;
        transition: all 0.18s ease;
      }
      .iz-field input[type="file"]::file-selector-button:hover {
        background: #cbd5e1;
      }
      .iz-item {
        border-top: 1px solid #e2e8f0;
        padding-top: 1rem;
        margin-top: 1rem;
      }
      button {
        padding: 9px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        background: #10b981;
        color: #fff;
        font: 600 13px inherit;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      button:hover {
        background: #059669;
        transform: translateY(-1px);
      }
      button.iz-remove {
        background: #fee2e2;
        border: 1px solid #fca5a5;
        color: #dc2626;
        font-weight: 600;
        margin-top: 0.6rem;
        box-shadow: none;
      }
      button.iz-remove:hover {
        background: #fecaca;
        border-color: #f87171;
      }
      [data-add] {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #059669;
        font-weight: 600;
        margin-top: 0.8rem;
        box-shadow: none;
      }
      [data-add]:hover {
        background: #d1fae5;
        border-color: #6ee7b7;
      }
      #save {
        position: sticky;
        bottom: 1.5rem;
        width: 100%;
        padding: 13px 20px;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: -0.2px;
        border-radius: 12px;
        background: #10b981;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        margin-top: 1.5rem;
      }
      #save:hover {
        background: #059669;
      }
      #toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid #10b981;
        padding: 10px 22px;
        border-radius: 9999px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        display: none;
        font-weight: 600;
        z-index: 99999;
      }
      ul#learned {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0 0;
      }
      ul#learned li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        margin: 0.5rem 0;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        color: #1e293b;
      }
      #cvName, #clName {
        font-size: 0.85rem;
        color: #059669;
        font-weight: 600;
        margin: 0.3rem 0;
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" style="display:block">
          <path d="M13.5 2.5L7 12.5H12L9.5 21.5L18 10.5H13L16 2.5H13.5Z" fill="#ffffff"/>
          <circle cx="18" cy="4.5" r="1.8" fill="#6ee7b7"/>
        </svg>
      </div>
      <h1>izifill</h1>
    </div>
    <p id="intro"></p>
    <div id="profilesBar"></div>
    <div id="ioBar">
      <button id="exportBtn" type="button"></button>
      <button id="importBtn" type="button"></button>
      <input type="file" id="importFile" accept=".json,application/json" hidden />
    </div>
    <div class="progress-card">
      <span id="progressLabel"></span> <span id="progress"></span>
    </div>
    <div id="tabs"></div>
    <div id="form"></div>
    <section class="iz-group" id="filesSection">
      <h2 id="filesTitle"></h2>
      <label class="iz-field"><span>CV (PDF)</span><input type="file" id="cvFile" accept=".pdf,.doc,.docx" /></label>
      <p id="cvName"></p>
      <label class="iz-field"><span id="clLabel"></span><input type="file" id="clFile" accept=".pdf,.doc,.docx,.txt" /></label>
      <p id="clName"></p>
    </section>
    <section class="iz-group">
      <h2 id="learnedTitle"></h2>
      <ul id="learned"></ul>
    </section>
    <button id="save"></button>
    <div id="toast"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
