<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131d2b"/>
      <stop offset="100%" stop-color="#080d14"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <rect x="10" y="10" width="108" height="108" rx="32" fill="url(#bgGlow)"/>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Liquid Glass Sheen -->
  <path d="M 10 38 Q 10 10 38 10 L 90 10 Q 118 10 118 38 L 118 52 Q 64 62 10 52 Z" fill="url(#sheenGrad)" opacity="0.9"/>

  <!-- Inner Specular Bevel -->
  <rect x="10.5" y="10.5" width="107" height="107" rx="27.5" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Central Dynamic 'iz' Spark Emblem -->
  <g filter="url(#emeraldGlow)">
    <path d="M 72 28 L 42 66 L 60 66 L 46 100 L 86 58 L 68 58 Z" fill="url(#sparkGrad)"/>
    <!-- Diamond Accent Dot -->
    <path d="M 88 32 L 95 39 L 88 46 L 81 39 Z" fill="#6ee7b7"/>
  </g>
</svg>
